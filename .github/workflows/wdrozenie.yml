# Wgrywanie na serwer b0r5.pl na żądanie (ręczne uruchomienie).
#
# Dane logowania NIE są w tym pliku. Trzeba je wpisać raz w GitHubie:
# Settings → Secrets and variables → Actions → New repository secret
#   FTP_SERVER    adres serwera FTP
#   FTP_USERNAME  nazwa użytkownika
#   FTP_PASSWORD  hasło
#
# Automat wgrywa tylko pliki, które się zmieniły, i usuwa tylko te, które sam wcześniej wgrał
# (pamięta je w pliku .ftp-deploy-sync-state.json na serwerze). Danych gry w api/dane/
# (konta, bank, firmy) nie ma w repozytorium, więc ich nie rusza.

name: Wdrożenie na serwer

# Tylko na żądanie: zakładka Actions → „Wdrożenie na serwer” → Run workflow
# (albo prośba do Claude'a, który uruchamia to samo). Nic nie wgrywa się samo po zmianie kodu.
on:
  workflow_dispatch:

concurrency:
  group: wdrozenie
  cancel-in-progress: false

jobs:
  ftp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wgraj pliki przez FTP (TLS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: /b0r5.pl/UGCC/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            **/node_modules/**
            narzedzia/**
            README.md
